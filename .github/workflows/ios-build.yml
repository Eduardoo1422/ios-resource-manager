name: iOS Build

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen (2.46.0)
        run: brew install xcodegen

      - name: Diagnostic Minimal Project Test (2.46.0)
        run: |
          mkdir -p test-minimal
          cat <<EOF > test-minimal/project.yml
          name: TestApp
          options:
            bundleIdPrefix: com.test
            deploymentTarget:
              iOS: 17.0
          targets:
            TestApp:
              type: application
              platform: iOS
          EOF
          echo "Testing with $(xcodegen --version)"
          xcodegen --spec test-minimal/project.yml --project test-minimal/Project || echo "2.46.0 failed as expected"
          if [ -d "test-minimal/Project/TestApp.xcodeproj" ]; then
            echo "RESULT_2_46_0=PASS" >> $GITHUB_ENV
          else
            echo "RESULT_2_46_0=FAIL" >> $GITHUB_ENV
          fi

      - name: Diagnostic Minimal Project Test (2.45.4)
        run: |
          # Install 2.45.4 (reproducible approach)
          brew unlink xcodegen
          # XcodeGen formula in homebrew-core does not support @version syntax.
          # We use a direct download/install approach for the binary.
          curl -LO https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          unzip xcodegen.zip
          ./xcodegen --version
          
          rm -rf test-minimal/Project
          ./xcodegen --spec test-minimal/project.yml --project test-minimal/Project
          
          if [ -d "test-minimal/Project/TestApp.xcodeproj" ]; then
            echo "RESULT_2_45_4=PASS" >> $GITHUB_ENV
          else
            echo "RESULT_2_45_4=FAIL" >> $GITHUB_ENV
          fi

      - name: Summarize Results
        run: |
          echo "Results:"
          echo "XcodeGen 2.46.0: $RESULT_2_46_0"
          echo "XcodeGen 2.45.4: $RESULT_2_45_4"
          echo "Executable (2.45.4): $(./xcodegen --version)"
          echo "Path (2.45.4): $(pwd)/xcodegen"


      - name: Verify Project Generation
        run: |
          if [ ! -d "ios-client/Project/iOSResourceManager.xcodeproj" ]; then
            echo "ERRO: Xcode project não foi gerado."
            find ios-client -maxdepth 3 -name "*.xcodeproj" -print
            ls -la ios-client
            ls -la ios-client/Project || true
            exit 1
          fi

          echo "Xcode project encontrado com sucesso."

      - name: List Schemes
        run: xcodebuild -project ios-client/Project/iOSResourceManager.xcodeproj -list

      - name: Build App
        run: |
          xcodebuild -project ios-client/Project/iOSResourceManager.xcodeproj \
                     -scheme iOSResourceManager \
                     -destination 'generic/platform=iOS' \
                     -configuration Debug \
                     -derivedDataPath Build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSResourceManager-App
          path: Build/Build/Products/Debug-iphoneos/iOSResourceManager.app
