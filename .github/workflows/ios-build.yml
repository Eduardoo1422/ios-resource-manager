name: iOS Build

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen (2.46.0)
        run: brew install xcodegen

      - name: Prepare Diagnostic Environment
        run: |
          mkdir -p test-minimal
          cat > test-minimal/project.yml <<'EOF'
          name: TestApp
          options:
            bundleIdPrefix: com.test
            deploymentTarget:
              iOS: 17.0
          targets:
            TestApp:
              type: application
              platform: iOS
          EOF

          # Prepare 2.45.4
          curl -LO https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          unzip -o xcodegen.zip
          chmod +x ./xcodegen/bin/xcodegen

      - name: Diagnostic Detailed Checks
        run: |
          echo "--- XcodeGen 2.46.0 Diagnostics ---"
          xcodegen --version || echo "2.46.0 version failed"
          which xcodegen || echo "2.46.0 which failed"
          file "$(which xcodegen)" || echo "2.46.0 file failed"
          ls -la "$(dirname "$(which xcodegen)")" || echo "2.46.0 ls failed"
          xcodegen dump --spec test-minimal/project.yml || echo "2.46.0 dump failed"

          echo "--- XcodeGen 2.45.4 Diagnostics ---"
          ./xcodegen/bin/xcodegen --version || echo "2.45.4 version failed"
          file ./xcodegen/bin/xcodegen || echo "2.45.4 file failed"
          ls -la ./xcodegen/bin/ || echo "2.45.4 ls failed"

      - name: Diagnostic Generation Tests (Non-Tolerant)
        run: |
          set +e
          echo "--- Test 1: No --project flag ---"
          cd test-minimal
          rm -rf Project TestApp.xcodeproj
          cp project.yml project_temp.yml
          ../xcodegen/bin/xcodegen generate --spec project_temp.yml
          STATUS_NO_PROJECT=$?
          echo "STATUS_NO_PROJECT=$STATUS_NO_PROJECT"
          file TestApp.xcodeproj 2>&1 || true
          ls -la TestApp.xcodeproj 2>&1 || true
          cd ..

          echo "--- Test 2: With --project flag ---"
          rm -rf test-minimal/Project test-minimal/TestApp.xcodeproj
          mkdir -p test-minimal/Project
          ./xcodegen/bin/xcodegen --spec test-minimal/project.yml --project test-minimal/Project
          STATUS_WITH_PROJECT=$?
          echo "STATUS_WITH_PROJECT=$STATUS_WITH_PROJECT"
          file test-minimal/Project/TestApp.xcodeproj 2>&1 || true
          ls -la test-minimal/Project/TestApp.xcodeproj 2>&1 || true
          find test-minimal/Project -maxdepth 3 -print 2>&1 || true

          echo "--- Final Tree Check ---"
          find test-minimal -maxdepth 4 -print 2>&1 || true




      - name: Verify Project Generation
        run: |
          if [ ! -d "ios-client/Project/iOSResourceManager.xcodeproj" ]; then
            echo "ERRO: Xcode project não foi gerado."
            find ios-client -maxdepth 3 -name "*.xcodeproj" -print
            ls -la ios-client
            ls -la ios-client/Project || true
            exit 1
          fi

          echo "Xcode project encontrado com sucesso."

      - name: List Schemes
        run: xcodebuild -project ios-client/Project/iOSResourceManager.xcodeproj -list

      - name: Build App
        run: |
          xcodebuild -project ios-client/Project/iOSResourceManager.xcodeproj \
                     -scheme iOSResourceManager \
                     -destination 'generic/platform=iOS' \
                     -configuration Debug \
                     -derivedDataPath Build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSResourceManager-App
          path: Build/Build/Products/Debug-iphoneos/iOSResourceManager.app
