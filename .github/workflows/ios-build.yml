name: iOS Build

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Diagnose XcodeGen
        run: |
          xcodegen --version
          which xcodegen
          xcodegen dump --spec ios-client/project.yml

      - name: Generate Project
        run: |
          rm -rf ios-client/Project
          xcodegen generate --spec ios-client/project.yml --project ios-client/Project

      - name: Verify Project Generation
        run: |
          if [ ! -d "ios-client/Project/iOSResourceManager.xcodeproj" ]; then
            echo "ERRO: Xcode project não foi gerado."
            find ios-client -maxdepth 3 -name "*.xcodeproj" -print
            ls -la ios-client
            ls -la ios-client/Project || true
            exit 1
          fi

          echo "Xcode project encontrado com sucesso."

      - name: List Schemes
        run: xcodebuild -project ios-client/Project/iOSResourceManager.xcodeproj -list

      - name: Build App
        run: |
          xcodebuild -project ios-client/Project/iOSResourceManager.xcodeproj \
                     -scheme iOSResourceManager \
                     -destination 'generic/platform=iOS' \
                     -configuration Debug \
                     -derivedDataPath Build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSResourceManager-App
          path: Build/Build/Products/Debug-iphoneos/iOSResourceManager.app
