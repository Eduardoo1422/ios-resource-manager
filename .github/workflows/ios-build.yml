name: iOS Build

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Diagnostic Minimal Project Test (2.46.0)
        run: |
          mkdir -p test-minimal
          cat <<EOF > test-minimal/project.yml
          name: TestApp
          options:
            bundleIdPrefix: com.test
            deploymentTarget:
              iOS: 17.0
          targets:
            TestApp:
              type: application
              platform: iOS
          EOF
          xcodegen --spec test-minimal/project.yml --project test-minimal/Project
          if [ -d "test-minimal/Project/TestApp.xcodeproj" ]; then
            echo "Minimal project generation succeeded with 2.46.0"
          else
            echo "Minimal project generation failed with 2.46.0"
            exit 1
          fi

      - name: Diagnostic Minimal Project Test (2.45.4)
        run: |
          brew unlink xcodegen
          brew install xcodegen@2.45.4 || brew install https://raw.githubusercontent.com/Homebrew/homebrew-core/b7b92f4477813a83095368a5c2d33486c478cf84/Formula/x/xcodegen.rb
          # Note: The above is a best-effort approach to install a specific version if not available directly via brew.
          # If this fails, we will skip the downgrade test or use a different method.
          xcodegen --version
          rm -rf test-minimal/Project
          xcodegen --spec test-minimal/project.yml --project test-minimal/Project
          if [ -d "test-minimal/Project/TestApp.xcodeproj" ]; then
            echo "Minimal project generation succeeded with 2.45.4"
          else
            echo "Minimal project generation failed with 2.45.4"
          fi

      - name: Diagnose XcodeGen
        run: |
          xcodegen --version
          which xcodegen
          xcodegen dump --spec ios-client/project.yml

      - name: Generate Project
        run: |
          rm -rf ios-client/Project
          xcodegen generate --spec ios-client/project.yml --project ios-client/Project

      - name: Verify Project Generation
        run: |
          if [ ! -d "ios-client/Project/iOSResourceManager.xcodeproj" ]; then
            echo "ERRO: Xcode project não foi gerado."
            find ios-client -maxdepth 3 -name "*.xcodeproj" -print
            ls -la ios-client
            ls -la ios-client/Project || true
            exit 1
          fi

          echo "Xcode project encontrado com sucesso."

      - name: List Schemes
        run: xcodebuild -project ios-client/Project/iOSResourceManager.xcodeproj -list

      - name: Build App
        run: |
          xcodebuild -project ios-client/Project/iOSResourceManager.xcodeproj \
                     -scheme iOSResourceManager \
                     -destination 'generic/platform=iOS' \
                     -configuration Debug \
                     -derivedDataPath Build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSResourceManager-App
          path: Build/Build/Products/Debug-iphoneos/iOSResourceManager.app
